name: Build

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type }}-${{ github.sha }}
  cancel-in-progress: false

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  # Detect changes to Unity code and determine if a rebuild is necessary.
  check-unity-changes:
    name: Check Unity Changes
    runs-on: ubuntu-latest
    outputs:
      unity-changed: ${{ steps.filter.outputs.unity }}
      unity-hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Check for Unity changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            unity:
              - 'Source/YaOpt.Unity/Assets/**'
              - 'Source/YaOpt.Unity/Packages/**'
              - 'Source/YaOpt.Unity/ProjectSettings/**'

      - name: Generate Unity source hash
        id: hash
        run: |
          HASH=$(find Source/YaOpt.Unity -type f \( -name "*.cs" -o -name "*.asmdef" -o -name "*.json" -o -name "*.asset" \) -exec sha256sum {} \; 2>/dev/null | sha256sum | cut -d' ' -f1 | cut -c1-16)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Unity source hash: $HASH"

  # Unity Build - Execute only when code changes
  build-unity:
    name: Build Unity (${{ matrix.targetPlatform }})
    needs: check-unity-changes
    if: needs.check-unity-changes.outputs.unity-changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - StandaloneLinux64
          - StandaloneOSX
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Source/YaOpt.Unity/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Source/YaOpt.Unity/Packages/manifest.json') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-

      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Source/YaOpt.Unity
          targetPlatform: ${{ matrix.targetPlatform }}
          buildMethod: BuildCommand.PerformBuild
          customParameters: -nographics
          versioning: None

      - name: Upload Unity Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unity-artifacts-${{ matrix.targetPlatform }}
          path: Source/YaOpt.Unity/Builds/Artifacts/${{ matrix.targetPlatform }}
          retention-days: 1

      - name: Cache Unity Build Output
        uses: actions/cache/save@v3
        with:
          path: Source/YaOpt.Unity/Builds/Artifacts
          key: unity-build-${{ needs.check-unity-changes.outputs.unity-hash }}-${{ matrix.targetPlatform }}

  # Restore cached Unity Artifacts (when the code has not changed).
  restore-unity-cache:
    name: Restore Unity Cache (${{ matrix.targetPlatform }})
    needs: check-unity-changes
    if: needs.check-unity-changes.outputs.unity-changed == 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        targetPlatform:
          - StandaloneWindows64
          - StandaloneLinux64
          - StandaloneOSX
    steps:
      - name: Restore Unity Build Cache
        id: cache
        uses: actions/cache/restore@v3
        with:
          path: Source/YaOpt.Unity/Builds/Artifacts
          key: unity-build-${{ needs.check-unity-changes.outputs.unity-hash }}-${{ matrix.targetPlatform }}

      - name: Upload Unity Artifacts
        if: steps.cache.outputs.cache-hit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unity-artifacts-${{ matrix.targetPlatform }}
          path: Source/YaOpt.Unity/Builds/Artifacts/${{ matrix.targetPlatform }}
          retention-days: 1

      - name: Cache miss warning
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "::warning::Unity cache miss - this should not happen if code hasn't changed"
          echo "Consider triggering a manual rebuild with workflow_dispatch"
          exit 1

  # Main project build
  build-main:
    name: Build Main Project
    needs: [build-unity, restore-unity-cache]
    if: always() && (needs.build-unity.result == 'success' || needs.restore-unity-cache.result == 'success')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1

      - name: Create Output Directories
        shell: bash
        run: mkdir -p 1.6/Assemblies 1.6/Burst

      - name: Download Unity Artifacts (Windows)
        uses: actions/download-artifact@v4
        with:
          name: unity-artifacts-StandaloneWindows64
          path: temp/windows

      - name: Download Unity Artifacts (Linux)
        uses: actions/download-artifact@v4
        with:
          name: unity-artifacts-StandaloneLinux64
          path: temp/linux

      - name: Download Unity Artifacts (macOS)
        uses: actions/download-artifact@v4
        with:
          name: unity-artifacts-StandaloneOSX
          path: temp/macos

      - name: Organize Artifacts
        shell: bash
        run: |
          cp temp/windows/lib_burst_generated.dll 1.6/Burst/
          cp temp/linux/lib_burst_generated.so 1.6/Burst/
          cp -r temp/macos/lib_burst_generated.bundle 1.6/Burst/
          cp temp/windows/YaOpt.Unity.dll 1.6/Assemblies/

      - name: Restore NuGet Packages
        run: nuget restore Source/YaOpt.sln

      - name: Build Main Project
        run: msbuild Source/YaOpt.sln /p:Configuration=Release /p:Platform=AnyCPU

      - name: Upload Final Build
        uses: actions/upload-artifact@v4
        with:
          name: YetAnotherOptimizer-1.6
          path: 1.6/

  publish:
    name: Publish
    needs: build-main
    if: always() && needs.build-main.result == 'success' && (github.ref_type == 'tag' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: YetAnotherOptimizer-1.6
          path: build/1.6

      - name: Package Mod
        shell: bash
        run: |
          mkdir -p output
          cp -r build/1.6 output/1.6
          cp -r About output/
          cp -r Common output/
          cp LoadFolders.xml output/
          [ -f CHANGELOG.md ] && cp CHANGELOG.md output/
          cd output
          zip -r ../YetAnotherOptimizer.zip .

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            YetAnotherOptimizer.zip

      - name: Create Nightly Pre-release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA_SHORT=$(git rev-parse --short=7 HEAD)
          DATE=$(date +'%Y%m%d')
          RELEASE_NAME="nightly-${DATE}-${SHA_SHORT}"
          if git tag --points-at HEAD | grep -q '^v'; then
            echo "Commit already version-tagged, skipping nightly"
            exit 0
          fi
          gh release create "$RELEASE_NAME" \
            --title "$RELEASE_NAME" \
            --prerelease \
            --notes "Nightly build from commit ${SHA_SHORT}" \
            YetAnotherOptimizer.zip
